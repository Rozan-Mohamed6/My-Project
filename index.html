<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Library</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f3ef;
            color: #333;
        }

        header {
            background-color: #3f3d56;
            color: white;
            text-align: center;
            padding: 35px;
        }

        header h1 {
            margin: 0 0 10px;
        }

        main {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        section {
            margin-bottom: 30px;
        }

        h2 {
            text-align: center;
        }

        .search-box {
            text-align: center;
        }

        #searchInput {
            width: 70%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
        }

        .search-btn {
            background-color: #3f3d56;
            color: white;
        }

        .category-btn {
            background-color: #ddd;
        }

        .category-btn:hover,
        .search-btn:hover {
            opacity: 0.8;
        }

        .categories {
            text-align: center;
        }

        #booksContainer {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .book-card {
            background-color: white;
            width: 230px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .book-card h3 {
            color: #3f3d56;
        }

        .details-btn {
            background-color: #3f3d56;
            color: white;
            width: 100%;
        }

        .delete-btn {
            background-color: #d9534f;
            color: white;
            width: 100%;
        }

        #detailsBox {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            display: none;
        }

        .add-section {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
        }

        .add-section input,
        .add-section select {
            width: 100%;
            padding: 10px;
            margin: 7px 0;
            box-sizing: border-box;
        }

        .add-btn {
            background-color: #3f3d56;
            color: white;
            width: 100%;
        }

        footer {
            text-align: center;
            padding: 20px;
            background-color: #3f3d56;
            color: white;
            margin-top: 40px;
        }

    </style>

</head>


<body>

    <header>

        <h1>📚 Smart Library</h1>

        <p>Find and manage your favorite books</p>

    </header>


    <main>

        <section class="search-box">

            <h2>Search for a Book</h2>

            <input
                type="text"
                id="searchInput"
                placeholder="Enter book title or author"
            >

            <button
                class="search-btn"
                onclick="searchBooks()"
            >
                Search
            </button>

            <button
                class="category-btn"
                onclick="displayBooks()"
            >
                All Books
            </button>

        </section>

        <section class="categories">

            <h2>Categories</h2>

            <button
                class="category-btn"
                onclick="showCategory('Fantasy')"
            >
                Fantasy
            </button>

            <button
                class="category-btn"
                onclick="showCategory('Horror')"
            >
                Horror
            </button>

            <button
                class="category-btn"
                onclick="showCategory('Novel')"
            >
                Novel
            </button>

        </section> 

        <section>

            <h2>Our Books</h2>

            <div id="booksContainer"></div>

        </section>

        <section>

            <div id="detailsBox"></div>

        </section>

        <section class="add-section">

            <h2>Add New Book</h2>

            <input
                type="text"
                id="bookTitle"
                placeholder="Book Title"
            >

            <input
                type="text"
                id="bookAuthor"
                placeholder="Author"
            >

            <select id="bookCategory">

                <option value="Fantasy">
                    Fantasy
                </option>

                <option value="Horror">
                    Horror
                </option>

                <option value="Novel">
                    Novel
                </option>

            </select>

            <input
                type="number"
                id="bookYear"
                placeholder="Publication Year"
            >

            <button
                class="add-btn"
                onclick="addBook()"
            >
                Add Book
            </button>

        </section>

    </main>


    <footer>

        <p>Smart Library &copy; 2026</p>

    </footer>


    <script>

        let books = [

            {
                title: "خوف",
                author: "أسامة المسلم",
                category: "Horror",
                year: 2015
            },

            {
                title: "بساتين عربستان",
                author: "أسامة المسلم",
                category: "Fantasy",
                year: 2015
            },

            {
                title: "صخب الخسيف",
                author: "أسامة المسلم",
                category: "Horror",
                year: 2016
            },

            {
                title: "لج",
                author: "أسامة المسلم",
                category: "Fantasy",
                year: 2017
            },

            {
                title: "وهج البنفسج",
                author: "أسامة المسلم",
                category: "Fantasy",
                year: 2017
            },

            {
                title: "ملكة الغرانيق",
                author: "أسامة المسلم",
                category: "Fantasy",
                year: 2017
            },

            {
                title: "الدوائر الخمس",
                author: "أسامة المسلم",
                category: "Fantasy",
                year: 2019
            },

            {
                title: "شبكة العنكبوت",
                author: "أسامة المسلم",
                category: "Horror",
                year: 2021
            },

            {
                title: "أرض القرابين",
                author: "أسامة المسلم",
                category: "Novel",
                year: 2021
            },

            {
                title: "ليلة ماطرة",
                author: "أسامة المسلم",
                category: "Novel",
                year: 2021
            }

        ];


        function displayBooks() {

            let container =
                document.getElementById("booksContainer");

            container.innerHTML = "";


            for (let i = 0; i < books.length; i++) {

                container.innerHTML += `

                    <div class="book-card">

                        <h3>${books[i].title}</h3>

                        <p>
                            Author:
                            ${books[i].author}
                        </p>

                        <p>
                            Category:
                            ${books[i].category}
                        </p>

                        <p>
                            Year:
                            ${books[i].year}
                        </p>

                        <button
                            class="details-btn"
                            onclick="showDetails(${i})"
                        >
                            View Details
                        </button>

                        <button
                            class="delete-btn"
                            onclick="deleteBook(${i})"
                        >
                            Delete
                        </button>

                    </div>

                `;
            }

        }

        function searchBooks() {

            let searchText =
                document.getElementById("searchInput").value;

            searchText =
                searchText.toLowerCase();


            let container =
                document.getElementById("booksContainer");

            container.innerHTML = "";


            let found = false;


            for (let i = 0; i < books.length; i++) {

                let title =
                    books[i].title.toLowerCase();

                let author =
                    books[i].author.toLowerCase();


                if (
                    title.indexOf(searchText) !== -1 ||
                    author.indexOf(searchText) !== -1
                ) {

                    container.innerHTML += `

                        <div class="book-card">

                            <h3>${books[i].title}</h3>

                            <p>
                                Author:
                                ${books[i].author}
                            </p>

                            <p>
                                Category:
                                ${books[i].category}
                            </p>

                            <p>
                                Year:
                                ${books[i].year}
                            </p>

                            <button
                                class="details-btn"
                                onclick="showDetails(${i})"
                            >
                                View Details
                            </button>

                            <button
                                class="delete-btn"
                                onclick="deleteBook(${i})"
                            >
                                Delete
                            </button>

                        </div>

                    `;

                    found = true;

                }

            }


            if (found === false) {

                container.innerHTML =
                    "<p>No books found.</p>";

            }

        }

        function showCategory(category) {

            let container =
                document.getElementById("booksContainer");

            container.innerHTML = "";


            let found = false;


            for (let i = 0; i < books.length; i++) {

                if (books[i].category === category) {

                    container.innerHTML += `

                        <div class="book-card">

                            <h3>${books[i].title}</h3>

                            <p>
                                Author:
                                ${books[i].author}
                            </p>

                            <p>
                                Category:
                                ${books[i].category}
                            </p>

                            <p>
                                Year:
                                ${books[i].year}
                            </p>

                            <button
                                class="details-btn"
                                onclick="showDetails(${i})"
                            >
                                View Details
                            </button>

                            <button
                                class="delete-btn"
                                onclick="deleteBook(${i})"
                            >
                                Delete
                            </button>

                        </div>

                    `;

                    found = true;

                }

            }


            if (found === false) {

                container.innerHTML =
                    "<p>No books in this category.</p>";

            }

        }


        function showDetails(index) {

            let detailsBox =
                document.getElementById("detailsBox");


            detailsBox.style.display = "block";


            detailsBox.innerHTML = `

                <h2>${books[index].title}</h2>

                <p>
                    Author:
                    ${books[index].author}
                </p>

                <p>
                    Category:
                    ${books[index].category}
                </p>

                <p>
                    Publication Year:
                    ${books[index].year}
                </p>

            `;

        }


        function addBook() {

            let title =
                document.getElementById("bookTitle").value;

            let author =
                document.getElementById("bookAuthor").value;

            let category =
                document.getElementById("bookCategory").value;

            let year =
                document.getElementById("bookYear").value;


            if (
                title === "" ||
                author === "" ||
                year === ""
            ) {

                alert("Please fill all fields.");

                return;

            }


            let newBook = {

                title: title,

                author: author,

                category: category,

                year: year

            };


            books.push(newBook);


            document.getElementById("bookTitle").value = "";

            document.getElementById("bookAuthor").value = "";

            document.getElementById("bookYear").value = "";


            displayBooks();


            alert("Book added successfully!");

        }

        function deleteBook(index) {

            books.splice(index, 1);

            displayBooks();

            alert("Book deleted successfully!");

        }


        displayBooks();

    </script>

</body>

</html>
